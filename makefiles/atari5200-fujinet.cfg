# atari5200-fujinet.cfg -- a FujiNet Atari 5200 client: 32K of ROM at
# $4000-$BFFF around the cart's mailbox arena ($B000-$B7FF, served by the
# cart), the claim at $BFE0 and the BIOS's header at $BFE8.
#
# Zero page is $1D-$FF ($00-$18 are the BIOS's shadows, which the crt0's VBI
# keeps; $19-$1C are cc65's conio). RAM $021C-$3FFF holds DATA, BSS, the heap
# and, at its top, the C stack; screens and player/missile memory go there
# too, in the app's own aligned segments. ROM2 ($B800-$BFDF) is 1K-aligned
# room for a font (FONT) and anything else that fits. The crt0
# (bus/atari5200/crt0.s) fills CLAIM and CARTHDR; atari5200-romstamp.py
# checks them.
SYMBOLS {
    __STACKSIZE__:       type = weak, value = $0400;
    __RESERVED_MEMORY__: type = weak, value = $0000;
}
MEMORY {
    ZP:    file = "", define = yes, start = $001D, size = $00E3, type = rw;
    RAM:   file = "", define = yes, start = $021C, size = $4000 - $021C - __STACKSIZE__ - __RESERVED_MEMORY__, type = rw;
    STACK: file = "", define = yes, start = $4000 - __STACKSIZE__ - __RESERVED_MEMORY__, size = __STACKSIZE__, type = rw;
    ROM:   file = %O, define = yes, start = $4000, size = $7000, type = ro, fill = yes, fillval = $FF;
    ARENA: file = %O, start = $B000, size = $0800, type = ro, fill = yes, fillval = $FF;
    ROM2:  file = %O, define = yes, start = $B800, size = $07E0, type = ro, fill = yes, fillval = $FF;
    CLAIM: file = %O, start = $BFE0, size = $0008, type = ro, fill = yes, fillval = $00;
    HDR:   file = %O, start = $BFE8, size = $0018, type = ro;
}
SEGMENTS {
    ZEROPAGE: load = ZP,              type = zp;
    EXTZP:    load = ZP,              type = zp,  optional = yes;
    STARTUP:  load = ROM,             type = ro,  define = yes;
    LOWCODE:  load = ROM,             type = ro,  optional = yes;
    CODE:     load = ROM,             type = ro,  define = yes;
    RODATA:   load = ROM,             type = ro,  define = yes;
    DLIST:    load = ROM,             type = ro,  optional = yes, align = $400;
    DATA:     load = ROM, run = RAM,  type = rw,  define = yes;
    FONT:     load = ROM2,            type = ro,  optional = yes, align = $400;
    ONCE:     load = ROM2,            type = ro,  optional = yes;
    ROM2:     load = ROM2,            type = ro,  optional = yes;
    BSS:      load = RAM,             type = bss, define = yes;
    CLAIM:    load = CLAIM,           type = ro;
    CARTHDR:  load = HDR,             type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
